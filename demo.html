<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تجربة توقيع m_tayea</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f5f5;font-family:Tahoma,Arial,sans-serif}
  .card{background:#fff;padding:50px 60px;border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.08);text-align:center}
  h2{margin:0 0 10px}
  p{color:#666}
  /* زرار تجربة الوضع الداكن */
  button{margin-top:18px;padding:10px 24px;border:none;border-radius:999px;background:#0b0a0c;color:#fff;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
  <div class="card">
    <h2>ده موقع تجريبي 🧪</h2>
    <p>الشارة اللي في الزاوية الشمال تحت هي توقيع m_tayea — بيشتغل على أي خلفية</p>
    <button onclick="document.body.style.background=document.body.style.background==='rgb(11, 10, 12)'?'#f5f5f5':'#0b0a0c'">بدّل الخلفية</button>
  </div>

  <!-- التوقيع: السطر الوحيد اللي بتحتاجه في أي موقع -->
  <script src="mtayea-signature.js"></script>
</body>
</html>

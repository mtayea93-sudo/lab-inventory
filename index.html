/* ========== الوحدة العلاجية لأمراض الدم — التنسيقات ========== */
:root {
  --red: #c8102e;
  --primary: #1e3d59;
  --primary-dark: #14293d;
  --primary-light: #eaf1f8;
  --sky: #5b9bd5;
  --red-dark: #b00322;
  --red-light: #fff0f2;
  --ink: #1f2937;
  --muted: #6b7280;
  --line: #e5e7eb;
  --bg: #ffffff;
  --card: #ffffff;
  --shadow: 0 10px 30px rgba(17, 24, 39, .08);
  --radius: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
}
.container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
a { text-decoration: none; color: inherit; }
button { font-family: inherit; cursor: pointer; }

/* ---------- الشريط العلوي ---------- */
.topbar {
  background: #fff;
  border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 50;
}
.topbar-inner {
  display: flex; align-items: center; justify-content: space-between;
  height: 62px;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-logo { width: 34px; height: 34px; }
.brand-text { font-weight: 900; font-size: 1.05rem; color: var(--primary); line-height: 1.1; display: flex; flex-direction: column; }
.brand-text small { font-weight: 700; font-size: .72rem; color: var(--muted); }
.topbar-left { display: flex; align-items: center; gap: 10px; }
.topbar-hint { font-size: .82rem; color: var(--muted); }

/* ---------- جرس الإشعارات ---------- */
.bell-btn {
  position: relative;
  background: var(--red-light);
  border: 1px solid #ffd3da;
  width: 42px; height: 42px; border-radius: 12px;
  display: grid; place-items: center;
  color: var(--red);
  transition: .2s;
}
.bell-btn:hover { background: #ffe1e5; }
.bell-badge {
  position: absolute; top: -6px; left: -6px;
  background: var(--red); color: #fff;
  font-size: .7rem; font-weight: 800;
  min-width: 20px; height: 20px; border-radius: 999px;
  display: grid; place-items: center; padding: 0 5px;
  border: 2px solid #fff;
  animation: pulse 1.6s infinite;
}
@keyframes pulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.15); }
}

/* قائمة الإشعارات */
.notif-panel {
  position: absolute; top: 56px; left: 0;
  width: 340px; max-height: 420px; overflow: auto;
  background: #fff; border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow);
  z-index: 60;
}
.notif-panel header {
  padding: 12px 16px; font-weight: 800; font-size: .9rem;
  border-bottom: 1px solid var(--line);
  display: flex; justify-content: space-between; align-items: center;
  position: sticky; top: 0; background: #fff;
}
.notif-item {
  padding: 12px 16px; border-bottom: 1px solid #f3f4f6;
  display: flex; gap: 10px; align-items: flex-start;
}
.notif-item.unread { background: var(--primary-light); }
.notif-item .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--red); margin-top: 7px; flex-shrink: 0; }
.notif-item.read .dot { background: #d1d5db; }
.notif-item h5 { font-size: .86rem; margin-bottom: 2px; }
.notif-item p { font-size: .78rem; color: var(--muted); }
.notif-item time { font-size: .68rem; color: #9ca3af; display: block; margin-top: 3px; }
.notif-empty { padding: 24px; text-align: center; color: var(--muted); font-size: .85rem; }

/* ---------- صفحة الدخول ---------- */
.auth-wrap { display: flex; flex-direction: column; align-items: center; padding: 48px 0 64px; }
.auth-logo { width: 96px; height: 96px; margin-bottom: 20px; filter: drop-shadow(0 8px 16px rgba(217,4,41,.25)); }
.auth-title { font-size: 1.6rem; font-weight: 900; margin-bottom: 6px; }
.auth-sub { color: var(--muted); font-size: .95rem; margin-bottom: 32px; text-align: center; max-width: 420px; }

.auth-card {
  width: 100%; max-width: 460px;
  background: var(--card); border: 1px solid var(--line);
  border-radius: 18px; box-shadow: var(--shadow);
  padding: 28px;
}
.auth-tabs {
  display: grid; grid-template-columns: 1fr 1fr;
  background: #f3f4f6; border-radius: 12px; padding: 5px; margin-bottom: 26px;
}
.auth-tabs button {
  border: 0; background: transparent; padding: 10px;
  font-weight: 800; font-size: .92rem; color: var(--muted); border-radius: 9px;
  transition: .2s;
}
.auth-tabs button.active { background: #fff; color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.08); }

.field { margin-bottom: 18px; }
.field label { display: block; font-size: .85rem; font-weight: 700; margin-bottom: 7px; }
.field input, .field select, .field textarea {
  width: 100%; padding: 12px 14px;
  border: 1.5px solid var(--line); border-radius: 10px;
  font-family: inherit; font-size: .92rem; color: var(--ink);
  background: #fff; transition: .2s;
}
.field input:focus, .field select:focus, .field textarea:focus {
  outline: none; border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(30,61,89,.08);
}
.field .hint { font-size: .74rem; color: var(--muted); margin-top: 5px; }

/* ---------- أزرار ---------- */
.btn {
  border: 0; border-radius: 10px; padding: 12px 20px;
  font-weight: 800; font-size: .92rem; transition: .2s;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-primary {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff; box-shadow: 0 8px 20px rgba(30,61,89,.3);
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(30,61,89,.35); }
.btn-block { width: 100%; }
.btn-ghost { background: #f3f4f6; color: var(--ink); }
.btn-ghost:hover { background: #e5e7eb; }
.btn-sm { padding: 7px 13px; font-size: .8rem; border-radius: 8px; }
.btn-danger-soft { background: var(--primary-light); color: var(--primary); }
.btn-danger-soft:hover { background: #ffe1e5; }
.btn-green { background: #059669; color: #fff; }
.btn-green:hover { background: #047857; }
.btn:disabled { opacity: .55; cursor: not-allowed; transform: none !important; }

/* ---------- اللوحات ---------- */
.page { padding: 32px 0 64px; }
.page-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px; margin-bottom: 26px; }
.page-head h1 { font-size: 1.45rem; font-weight: 900; }
.page-head p { color: var(--muted); font-size: .88rem; }
.role-chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--primary-light); color: var(--primary);
  font-size: .78rem; font-weight: 800; padding: 5px 12px; border-radius: 999px;
}
.role-chip.admin { background: #fef3c7; color: #b45309; }

/* بطاقات الإحصائيات */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-bottom: 26px; }
.stat-card {
  background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
  padding: 18px; box-shadow: 0 4px 14px rgba(0,0,0,.04);
  display: flex; align-items: center; gap: 14px;
}
.stat-card .ic {
  width: 46px; height: 46px; border-radius: 12px;
  display: grid; place-items: center; flex-shrink: 0;
  background: var(--primary-light); color: var(--primary);
}
.stat-card .num { font-size: 1.5rem; font-weight: 900; line-height: 1.1; }
.stat-card .lbl { font-size: .78rem; color: var(--muted); font-weight: 700; }

/* البطاقات العامة */
.card {
  background: #fff; border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: 0 4px 14px rgba(0,0,0,.04);
  padding: 22px; margin-bottom: 22px;
}
.card h2 { font-size: 1.08rem; font-weight: 900; margin-bottom: 18px; display: flex; align-items: center; gap: 9px; }
.card h2 svg { color: var(--primary); }

/* تبويبات لوحة المستخدم */
.tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
.tabs button {
  border: 1.5px solid var(--line); background: #fff; color: var(--muted);
  padding: 10px 18px; border-radius: 999px; font-weight: 800; font-size: .86rem;
  transition: .2s;
}
.tabs button.active { background: var(--primary); border-color: var(--primary); color: #fff; box-shadow: 0 6px 16px rgba(30,61,89,.28); }

/* اختيار سحب العينة */
.radio-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.radio-card {
  border: 1.5px solid var(--line); border-radius: 12px; padding: 14px;
  cursor: pointer; transition: .2s; text-align: center;
}
.radio-card input { display: none; }
.radio-card strong { display: block; font-size: .88rem; margin-bottom: 3px; }
.radio-card span { font-size: .75rem; color: var(--muted); }
.radio-card:has(input:checked) { border-color: var(--primary); background: var(--primary-light); box-shadow: 0 0 0 4px rgba(30,61,89,.07); }
.radio-card:has(input:checked) strong { color: var(--primary); }

/* رفع الملفات */
.dropzone {
  border: 2px dashed #d1d5db; border-radius: 12px;
  padding: 26px; text-align: center; color: var(--muted);
  cursor: pointer; transition: .2s; background: #fafafa;
}
.dropzone:hover, .dropzone.drag { border-color: var(--red); background: var(--primary-light); color: var(--primary); }
.dropzone svg { margin-bottom: 8px; }
.file-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.file-item {
  display: flex; align-items: center; gap: 10px;
  background: #f9fafb; border: 1px solid var(--line);
  border-radius: 10px; padding: 9px 12px; font-size: .82rem;
}
.file-item img { width: 40px; height: 40px; object-fit: cover; border-radius: 8px; }
.file-item .fname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-item button { background: none; border: 0; color: var(--red); font-weight: 800; font-size: .75rem; }

/* جداول */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .85rem; }
th, td { padding: 12px 10px; text-align: right; border-bottom: 1px solid #f3f4f6; white-space: nowrap; }
th { font-size: .76rem; color: var(--muted); font-weight: 800; background: #fafafa; }
tr:hover td { background: #fdf8f9; }

/* حالات الحجز */
.status {
  display: inline-block; padding: 4px 11px; border-radius: 999px;
  font-size: .72rem; font-weight: 800;
}
.status.pending { background: #fef3c7; color: #b45309; }
.status.confirmed { background: #dbeafe; color: #1d4ed8; }
.status.done { background: #d1fae5; color: #065f46; }
.status.cancelled { background: #fee2e2; color: #b91c1c; }

select.status-select {
  border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px;
  font-family: inherit; font-size: .78rem; font-weight: 700; background: #fff;
}

.empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }
.empty-state svg { opacity: .35; margin-bottom: 10px; }

/* ---------- المودال الإجباري ---------- */
.mandatory-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(17,24,39,.62); backdrop-filter: blur(4px);
  display: grid; place-items: center; padding: 20px;
}
.mandatory-modal {
  background: #fff; border-radius: 20px; max-width: 460px; width: 100%;
  padding: 34px 28px; text-align: center;
  box-shadow: 0 30px 80px rgba(0,0,0,.3);
  animation: pop .35s cubic-bezier(.2,.9,.3,1.3);
  border-top: 6px solid var(--red);
}
@keyframes pop { from { transform: scale(.85); opacity: 0; } }
.mandatory-icon {
  width: 68px; height: 68px; border-radius: 50%;
  background: var(--primary-light); color: var(--primary);
  display: grid; place-items: center; margin: 0 auto 16px;
  animation: ring 1.4s infinite;
}
@keyframes ring {
  0%,100% { box-shadow: 0 0 0 0 rgba(217,4,41,.35); }
  50% { box-shadow: 0 0 0 14px rgba(217,4,41,0); }
}
.mandatory-modal h3 { font-size: 1.15rem; font-weight: 900; margin-bottom: 10px; }
.mandatory-modal p { color: var(--muted); font-size: .9rem; line-height: 1.9; margin-bottom: 22px; white-space: pre-line; }

/* ---------- إشعار واتساب-ستايل (بانر منزلق) ---------- */
.push-banner {
  position: fixed; top: -160px; right: 12px; left: 12px; z-index: 250;
  background: #fff; border-radius: 16px;
  box-shadow: 0 14px 44px rgba(0,0,0,.28);
  border-right: 5px solid var(--red);
  display: flex; gap: 12px; align-items: flex-start;
  padding: 14px 16px;
  transition: top .45s cubic-bezier(.2,.9,.3,1.15);
  max-width: 460px; margin: 0 auto;
}
.push-banner.show { top: 14px; }
.push-banner .push-ic {
  width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0;
  background: var(--red-light); display: grid; place-items: center; font-size: 1.2rem;
}
.push-banner strong { font-size: .9rem; display: block; }
.push-banner p { font-size: .78rem; color: var(--muted); margin-top: 2px; line-height: 1.6; }
.push-banner .push-close {
  background: none; border: 0; color: #9ca3af; font-size: 1rem; margin-right: auto;
}

/* ---------- Toast ---------- */
.toast {
  position: fixed; bottom: 24px; right: 50%; transform: translateX(50%);
  background: var(--ink); color: #fff; padding: 13px 22px;
  border-radius: 12px; font-size: .88rem; font-weight: 700;
  z-index: 300; box-shadow: 0 12px 30px rgba(0,0,0,.3);
  animation: pop .3s;
}
.toast.success { background: #065f46; }
.toast.error { background: var(--red); }

/* نافذة عرض الملفات */
.modal {
  position: fixed; inset: 0; z-index: 150;
  background: rgba(17,24,39,.6); backdrop-filter: blur(3px);
  display: grid; place-items: center; padding: 20px;
}
.modal-box {
  background: #fff; border-radius: 18px; max-width: 640px; width: 100%;
  max-height: 84vh; overflow: auto; padding: 26px;
  animation: pop .3s;
}
.modal-box h3 { font-weight: 900; margin-bottom: 16px; }
.modal-close { float: left; background: #f3f4f6; border: 0; width: 34px; height: 34px; border-radius: 50%; font-size: 1.1rem; }

/* استجابة الشاشات */
@media (max-width: 640px) {
  .radio-cards { grid-template-columns: 1fr; }
  .notif-panel { position: fixed; top: 66px; right: 10px; left: 10px; width: auto; }
  .auth-card { padding: 22px 18px; }
}

.brand-logo-img { width: 44px; height: 44px; object-fit: contain; border-radius: 8px; }
.auth-logo-img { width: 150px; height: auto; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 12px 28px rgba(30,61,89,.2); }

.btn-blue { background: #2563eb; color: #fff; }
.btn-blue:hover { background: #1d4ed8; }
.status.postponed { background: #ede9fe; color: #6d28d9; }

</style>

const LS_MEM = {};

function LSset(k, v) { try { window.localStorage.setItem(k, v); } catch (e) { LS_MEM[k] = v; } }

function addMonthsStr(dateStr, months) {
  if (!dateStr) return '';

}

function fileToCompressed(f, cb) {
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 1000;
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      cb(c.toDataURL('image/jpeg', 0.75));
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(f);
}

/* استخراج الميلاد/العمر/المحافظة من الرقم القومي */
const NID_GOVS = {'01':'القاهرة','02':'الإسكندرية','03':'بورسعيد','04':'السويس','11':'دمياط','12':'الدقهلية','13':'الشرقية','14':'القليوبية','15':'الغربية','16':'المنوفية','17':'البحيرة','18':'الإسماعيلية','19':'الجيزة','21':'الفيوم','22':'بني سويف','23':'المنيا','24':'أسيوط','25':'سوهاج','26':'قنا','27':'أسوان','28':'الأقصر','29':'البحر الأحمر','31':'مطروح','32':'شمال سيناء','33':'جنوب سيناء','34':'الوادي الجديد','35':'خارج الجمهورية'};
function parseNationalId(nid) {
  if (!NID_RE.test(nid)) return null;
  const century = nid[0] === '3' ? '20' : '19';
  const yy = nid.slice(1, 3), mm = nid.slice(3, 5), dd = nid.slice(5, 7);
  if (+mm < 1 || +mm > 12 || +dd < 1 || +dd > 31) return null;
  const birth = century + yy + '-' + mm + '-' + dd;
  const birthDate = new Date(birth + 'T00:00:00');
  const age = Math.floor((Date.now() - birthDate.getTime()) / (365.25 * 86400000));
  const gender = (+nid[12] % 2 === 1) ? 'ذكر' : 'أنثى';
  return { birth, age, gov: NID_GOVS[nid.slice(7, 9)] || 'غير معروفة', gender };
}

/* مزامنة اليوم مع التاريخ: اختيار اليوم يجيب أقرب تاريخ له، واختيار تاريخ يظبط اليوم */
const DAY_IDX = { 'الأحد': 0, 'الاثنين': 1, 'الثلاثاء': 2, 'الأربعاء': 3, 'الخميس': 4, 'الجمعة': 5, 'السبت': 6 };
function nextDateForDay(dayName, fromStr) {
  const target = DAY_IDX[dayName];
  if (target === undefined) return '';
  const d = fromStr ? new Date(fromStr + 'T00:00:00') : new Date();
  const diff = (target - d.getDay() + 7) % 7;
  d.setDate(d.getDate() + diff);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function wireDayDate(pfx) {
  const daySel = $('#' + pfx + '-day');
  const dateIn = $('#' + pfx + '-date');
  if (!daySel || !dateIn) return;
  daySel.onchange = () => { dateIn.value = nextDateForDay(daySel.value, dateIn.value || undefined); };
  dateIn.onchange = () => {
    if (!dateIn.value) return;
    const wd = new Date(dateIn.value + 'T00:00:00').getDay();
    if (wd === 0) {
      toast('يوم الأحد مخصص لحجز العيادة فقط — اختر يومًا آخر', 'error');
      dateIn.value = '';
      return;
    }
    const name = Object.keys(DAY_IDX).find(k => DAY_IDX[k] === wd);
    if (name) daySel.value = name;
  };
}
const NL = String.fromCharCode(10);
const STATUS_LABELS = { pending: 'قيد المراجعة', confirmed: 'تم التأكيد', done: 'تم التركيب', postponed: 'مؤجل', cancelled: 'ملغي' };
const PHONE_RE = /^01[0-9]{9}$/;
const NID_RE = /^[0-9]{14}$/;
const FB_EMAIL_SUFFIX = '@htu-user.app';

/* =====================================================
   طبقة التخزين: Firebase أو localStorage (تلقائي)
   ===================================================== */
const USE_FB = !!(window.FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.startsWith('PASTE'));

const Store = {
  mode: USE_FB ? 'firebase' : 'local',
  state: { user: null, profile: null, users: {}, bookings: {}, notifs: {} },
  listeners: [],

  init() {
    if (this.mode === 'firebase') {
      const start = () => {
      firebase.initializeApp(FIREBASE_CONFIG);
      this.auth = firebase.auth();
      this.db = firebase.database();
      this.auth.onAuthStateChanged(async fu => {
        if (fu) {
          await this._ensureProfile(fu);
          this._attach(fu.uid);
          this._initMessaging(fu);
        } else {
          this._detach();
          this.state.user = null;
          this.state.profile = null;
          this._notify();
        }
      });
      };
      const fbReady = () => !!(window.firebase && firebase.auth && firebase.database);
      if (fbReady()) start();
      else { const t = setInterval(() => { if (fbReady()) { clearInterval(t); start(); } }, 200); }
    } else {
      this._seedLocal();
      this._emitLocal();
    }
  },

  onChange(cb) { this.listeners.push(cb); },
  _notify() { this.listeners.forEach(cb => cb()); },

  async _ensureProfile(fu) {
    const ref = this.db.ref('users/' + fu.uid);
    const snap = await ref.get();
    if (!snap.exists()) {
      const all = await this.db.ref('users').get();
      const isFirst = !all.exists() || Object.keys(all.val() || {}).length === 0;
      const profile = {
        name: fu.displayName || (fu.email || '').replace(FB_EMAIL_SUFFIX, ''),
        phone: (fu.email || '').replace(FB_EMAIL_SUFFIX, ''),
        email: '',
        role: isFirst ? 'admin' : 'user',
        isRoot: isFirst,
        userType: isFirst ? 'staff' : 'patient',
        profileComplete: !!isFirst,
        nationalId: '', bloodType: '', hemoglobin: '', address: '', patientNationalId: '',
        createdAt: new Date().toISOString()
      };
      await ref.set(profile);
    }
  },

  _attach(uidKey) {
    this._detach();
    this.db.ref('users').on('value', s => { this.state.users = s.val() || {}; this._syncProfile(uidKey); });
    this.db.ref('bookings').on('value', s => { this.state.bookings = s.val() || {}; this._notify(); });
    this.db.ref('notifications').on('value', s => { this.state.notifs = s.val() || {}; this._notify(); });
  },
  _syncProfile(uidKey) {
    this.state.user = { uid: uidKey };
    this.state.profile = this.state.users[uidKey] || null;
    this._notify();
  },
  _detach() {
    if (this.db) ['users', 'bookings', 'notifications'].forEach(p => this.db.ref(p).off());
  },

  /* ----- Firebase Cloud Messaging (إشعارات Push) ----- */
  _initMessaging(fu) {
    try {
      if (!('Notification' in window) || !('serviceWorker' in navigator)) return;
      const messaging = firebase.messaging();
      Notification.requestPermission().then(perm => {
        if (perm !== 'granted') return;
        return navigator.serviceWorker.register('firebase-messaging-sw.js').then(reg => {
          if (FIREBASE_CONFIG.vapidKey && !String(FIREBASE_CONFIG.vapidKey).startsWith('PASTE')) {
            return messaging.getToken({ vapidKey: FIREBASE_CONFIG.vapidKey, serviceWorkerRegistration: reg }).then(token => {
              if (token) {
                const key = btoa(token).replace(/[^a-zA-Z0-9]/g, '').slice(0, 60);
                this.db.ref(`users/${fu.uid}/fcmTokens/${key}`).set(token);
              }
            });
          }
        });
      });
      messaging.onMessage(payload => {
        const n = payload.notification || {};
        showBanner({ title: n.title || 'إشعار جديد', body: n.body || '' });
        notifyNative(n.title, n.body);
      });
    } catch (e) { /* الإشعارات غير مفعّلة بعد */ }
  },

  /* ----- الدخول والتسجيل برقم التليفون ----- */
  async signIn(phone, pass) {
    await this.auth.signInWithEmailAndPassword(phone + FB_EMAIL_SUFFIX, pass);
  },
  async register(name, phone, pass) {
    const cred = await this.auth.createUserWithEmailAndPassword(phone + FB_EMAIL_SUFFIX, pass);
    await cred.user.updateProfile({ displayName: name });
    await this.db.ref('users/' + cred.user.uid).update({ name, phone });
    await this.sendNotif({ to: 'admins', title: 'مستخدم جديد', body: `قام ${name} (${phone}) بإنشاء حساب جديد.`, mandatory: false });
  },
  signOut() { this.mode === 'firebase' ? this.auth.signOut() : null; this._localLogout(); },

  saveBooking(b) {
    if (this.mode === 'firebase') this.db.ref('bookings/' + b.id).set(b);
    else { this._local().bookings[b.id] = b; this._commit(); }
  },
  updateBooking(id, patch) {
    if (this.mode === 'firebase') this.db.ref('bookings/' + id).update(patch);
    else { Object.assign(this._local().bookings[id], patch); this._commit(); }
  },
  setBookingStatus(id, status) {
    const cur = (this.state.bookings[id] || {}).status;
    const isUnit = (this.state.bookings[id] || {}).type === 'unit';
    if (this.mode === 'firebase') {
      this.db.ref('bookings/' + id + '/status').set(status);
      if (isUnit && status === 'done' && cur !== 'done') this._bumpTransfusion(id, +1);
      if (isUnit && status !== 'done' && cur === 'done') this._bumpTransfusion(id, -1);
    } else {
      const d = this._local();
      const b = d.bookings[id];
      if (b) {
        const old = b.status;
        b.status = status;
        const u = d.users.find(x => x.id === b.userId);
        if (u) {
          if (b.type === 'unit' && status === 'done' && old !== 'done') u.transfusionCount = (u.transfusionCount || 0) + 1;
          if (b.type === 'unit' && status !== 'done' && old === 'done') u.transfusionCount = Math.max(0, (u.transfusionCount || 0) - 1);
        }
        this._commitLocal(d);
        this._emitLocal();
      }
    }
  },
  _bumpTransfusion(bookingId, delta) {
    const b = this.state.bookings[bookingId];
    if (!b) return;
    this.db.ref('users/' + b.userId + '/transfusionCount').transaction(v => Math.max(0, (v || 0) + delta));
  },
  setUserRole(id, role) {
    if (this.mode === 'firebase') this.db.ref('users/' + id + '/role').set(role);
    else { this._local().users.find(u => u.id === id).role = role; this._commit(); }
  },
  adminUpdateUser(id, patch) {
    if (this.mode === 'firebase') this.db.ref('users/' + id).update(patch);
    else {
      const d = this._local();
      const u = d.users.find(x => x.id === id);
      if (u) { Object.assign(u, patch); this._commitLocal(d); this._emitLocal(); }
    }
  },
  deleteUser(id) {
    if (this.mode === 'firebase') {
      this.db.ref('users/' + id).remove();
      Object.values(this.state.bookings).filter(b => b.userId === id)
        .forEach(b => this.db.ref('bookings/' + b.id).remove());
    } else {
      const d = this._local();
      d.users = d.users.filter(x => x.id !== id);
      Object.keys(d.bookings).forEach(k => { if (d.bookings[k].userId === id) delete d.bookings[k]; });
      this._commitLocal(d);
      this._emitLocal();
    }
  },
  pushTransfusionLog(uid, key, entry) {
    if (this.mode === 'firebase') {
      this.db.ref('users/' + uid + '/transfusionLog/' + key).set(entry);
    } else {
      const d = this._local();
      const u = d.users.find(x => x.id === uid);
      if (u) {
        u.transfusionLog = u.transfusionLog || [];
        u.transfusionLog.push(entry);
        this._commitLocal(d);
        this._emitLocal();
      }
    }
  },
  deleteBooking(id) {
    if (this.mode === 'firebase') this.db.ref('bookings/' + id).remove();
    else {
      const d = this._local();
      delete d.bookings[id];
      this._commitLocal(d);
      this._emitLocal();
    }
  },
  updateProfile(patch) {
    const me = this.state.user;
    if (!me) return;
    if (this.mode === 'firebase') this.db.ref('users/' + me.uid).update(patch);
    else {
      const d = this._local();
      const u = d.users.find(x => x.id === me.uid);
      if (u) { Object.assign(u, patch); this._commitLocal(d); this._emitLocal(); }
    }
  },
  sendNotif(n) {
    const full = { id: uid(), readBy: {}, createdAt: new Date().toISOString(), mandatory: true, ...n };
    if (this.mode === 'firebase') this.db.ref('notifications/' + full.id).set(full);
    else { full.readBy = []; this._local().notifs.push(full); this._commit(); }
  },
  markRead(id, userId) {
    if (this.mode === 'firebase') this.db.ref(`notifications/${id}/readBy/${userId}`).set(true);
    else {
      const n = this._local().notifs.find(x => x.id === id);
      if (n && !n.readBy.includes(userId)) { n.readBy.push(userId); this._commit(); }
    }
  },

  _local() {
    return {
      users: JSON.parse(LSget('htu_users') || '[]'),
      bookings: JSON.parse(LSget('htu_bookings_l') || '{}'),
      notifs: JSON.parse(LSget('htu_notifs') || '[]'),
      session: LSget('htu_session_l')
    };
  },
  _commitLocal(d) {
    LSset('htu_users', JSON.stringify(d.users));
    LSset('htu_bookings_l', JSON.stringify(d.bookings));
    LSset('htu_notifs', JSON.stringify(d.notifs));
  },
  _commit() { this._emitLocal(); },
  _seedLocal() {
    const d = this._local();
    if (!d.users.find(u => u.phone === '01000000000')) {
      d.users.unshift({
        id: 'admin-root', name: 'المشرف الرئيسي', phone: '01000000000', password: 'admin123',
        role: 'admin', isRoot: true, userType: 'staff', profileComplete: true,
        nationalId: '', bloodType: '', hemoglobin: '', address: '', patientNationalId: '',
        createdAt: new Date().toISOString()
      });
    }
    if (d.notifs.length === 0) {
      d.notifs.push({ id: 'n-welcome', to: 'all', title: 'مرحباً بك في الوحدة العلاجية لأمراض الدم', body: `يمكنك الآن طلب وحدات الدم ومتابعة حالتها بكل سهولة.
يرجى الالتزام بمواعيد سحب العينة المحددة في طلبك.`, mandatory: true, readBy: [], createdAt: new Date().toISOString() });
    }
    this._commitLocal(d);
  },
  _emitLocal() {
    const d = this._local();
    const me = d.users.find(u => u.id === d.session) || null;
    this.state.user = me ? { uid: me.id } : null;
    this.state.profile = me;
    this.state.users = Object.fromEntries(d.users.map(u => [u.id, u]));
    this.state.bookings = d.bookings;
    this.state.notifs = Object.fromEntries(d.notifs.map(n => [n.id, n]));
    this._notify();
  },
  localSignIn(phone, pass) {
    const d = this._local();
    const u = d.users.find(x => x.phone === phone && x.password === pass);
    if (!u) throw new Error('رقم التليفون أو كلمة المرور غير صحيحة');
    LSset('htu_session_l', u.id);
    this._emitLocal();
  },
  localRegister(name, phone, pass) {
    const d = this._local();
    if (d.users.find(x => x.phone === phone)) throw new Error('هذا الرقم مسجّل بالفعل');
    const u = {
      id: uid(), name, phone, password: pass, role: 'user',
      userType: 'patient', profileComplete: false,
      nationalId: '', bloodType: '', hemoglobin: '', address: '', patientNationalId: '',
      createdAt: new Date().toISOString()
    };
    d.users.push(u);
    this._commitLocal(d);
    LSset('htu_session_l', u.id);
    this._emitLocal();
    this.sendNotif({ to: 'admins', title: 'مستخدم جديد', body: `قام ${name} (${phone}) بإنشاء حساب جديد.`, mandatory: false });
  },
  _localLogout() {
    if (this.mode === 'local') {
      LSremove('htu_session_l');
      this._emitLocal();
    }
  }
};

/* =====================================================
   الإشعارات
   ===================================================== */
function currentUser() { return Store.state.profile; }

function getMyNotifications(user) {
  if (!user) return [];
  const uidKey = Store.state.user.uid;
  return Object.values(Store.state.notifs)
    .filter(n => n.to === 'all' || n.to === uidKey || (n.to === 'admins' && user.role === 'admin'))
    .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
}
function readByMe(n) {
  if (Store.mode === 'firebase') return !!n.readBy?.[Store.state.user.uid];
  return (n.readBy || []).includes(Store.state.user.uid);
}
function unreadCount(user) {
  return getMyNotifications(user).filter(n => !readByMe(n)).length;
}

/* =====================================================
   إشعارات فورية زي الواتساب

const pageLoadTime = Date.now();
const firedNotifs = new Set();

function notifyNative(title, body) {
  if (!('Notification' in window)) return;
  if (Notification.permission !== 'granted') return;
  try {
    const n = new Notification(title || 'إشعار جديد', { body: body || '', dir: 'rtl', lang: 'ar', tag: 'htu-' + (title || '').slice(0, 20) });
    n.onclick = () => { window.focus(); n.close(); };
  } catch (e) {}
}

function requestNotifPermission() {
  try {
    if ('Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission();
    }
  } catch (_) {}
}

function showBanner(n) {
  document.querySelectorAll('.push-banner').forEach(b => b.remove());
  const b = document.createElement('div');
  b.className = 'push-banner';
  b.innerHTML = `
    <div class="push-ic">🔔</div>
    <div style="flex:1;min-width:0">
      <strong>${esc(n.title)}</strong>
      <p>${esc(String(n.body || '').split(NL)[0])}</p>
    </div>
    <button class="push-close">✕</button>`;
  document.body.appendChild(b);
  const dismiss = () => { b.classList.remove('show'); setTimeout(() => b.remove(), 450); };
  b.querySelector('.push-close').onclick = dismiss;
  b.onclick = e => {
    if (e.target.closest('.push-close')) return;
    notifOpen = true; renderNotifPanel(); dismiss();
  };
  setTimeout(() => b.classList.add('show'), 60);
  setTimeout(dismiss, 7000);
}

function scanNewNotifications() {
  const user = currentUser();
  if (!user) return;
  getMyNotifications(user).forEach(n => {
    if (readByMe(n)) return;
    if (new Date(n.createdAt).getTime() <= pageLoadTime) return;
    if (firedNotifs.has(n.id)) return;
    firedNotifs.add(n.id);
    showBanner(n);
    notifyNative(n.title, n.body);
  });
}

   الشريط العلوي + قائمة الإشعارات
   ===================================================== */
let notifOpen = false;

function renderTopbar() {
  const user = currentUser();
  const box = $('#topbar-left');
  if (!user || !Store.state.user) {
    box.innerHTML = `<span class="topbar-hint">يرجى تسجيل الدخول${Store.mode === 'local' ? ' — وضع تجريبي محلي' : ''}</span>`;
    return;
  }
  const unread = unreadCount(user);
  box.innerHTML = `
    <div style="position:relative">
      <button class="bell-btn" id="bell-btn" title="الإشعارات">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        ${unread ? `<span class="bell-badge">${unread}</span>` : ''}
      </button>
      <div id="notif-slot"></div>
    </div>
    <span class="role-chip ${user.role === 'admin' ? 'admin' : ''}">${user.role === 'admin' ? 'مشرف' : (USER_TYPES[user.userType] || 'مستخدم')}</span>
    <span style="font-size:.85rem;font-weight:800">${esc(user.name)}</span>
    <button class="btn btn-ghost btn-sm" id="logout-btn">خروج</button>`;
  $('#logout-btn').onclick = () => { Store.signOut(); location.hash = '#/'; };
  $('#bell-btn').onclick = e => { e.stopPropagation(); notifOpen = !notifOpen; renderNotifPanel(); };
}

function renderNotifPanel() {
  const slot = $('#notif-slot');
  if (!slot) return;
  const user = currentUser();
  if (!user || !notifOpen) { slot.innerHTML = ''; return; }
  const list = getMyNotifications(user);
  slot.innerHTML = `
    <div class="notif-panel">
      <header>
        الإشعارات
        <button class="btn btn-ghost btn-sm" id="mark-all-read">قراءة الكل</button>
      </header>
      ${list.length === 0 ? `<div class="notif-empty">لا توجد إشعارات</div>` : list.map(n => `
        <div class="notif-item ${readByMe(n) ? 'read' : 'unread'}" data-id="${n.id}">
          <span class="dot"></span>
          <div style="flex:1">
            <h5>${esc(n.title)} ${n.mandatory ? '<span style="color:var(--red);font-size:.68rem">(إجباري)</span>' : ''}</h5>
            <p>${esc(n.body).split(NL).join('<br>')}</p>
            <time>${fmtDate(n.createdAt)}</time>
          </div>
        </div>`).join('')}
    </div>`;
  $('#mark-all-read').onclick = () => {
    list.forEach(n => { if (!readByMe(n)) Store.markRead(n.id, Store.state.user.uid); });
    renderTopbar(); renderNotifPanel();
  };
  $$('.notif-item', slot).forEach(el => {
    el.onclick = () => {
      const n = list.find(x => x.id === el.dataset.id);
      const me2 = currentUser();
      Store.markRead(el.dataset.id, Store.state.user.uid);
      notifOpen = false;
      renderTopbar();
      renderNotifPanel();
      if (!n || !me2) return;
      if (me2.role === 'admin') {
        if (n.link && String(n.link).startsWith('user:')) {
          renderAdmin();
          setTimeout(() => openUserEdit(String(n.link).split(':')[1]), 60);
          return;
        }
        adminTab = 'bookings';
        renderAdmin();
      } else {
        const t = (n.title || '') + ' ' + (n.body || '');
        userTab = /عيادة/.test(t) ? 'clinic' : 'my';
        renderUserDashboard();
      }
    };
  });
}
document.addEventListener('click', e => {
  if (notifOpen && !e.target.closest('#notif-slot') && !e.target.closest('#bell-btn')) {
    notifOpen = false; renderNotifPanel();
  }
});

function userTypeCards(selected) {
  const types = [
    { v: 'patient', t: 'مريض', d: 'أطلب وحدات دم لنفسي' },
    { v: 'guardian', t: 'ولي أمر', d: 'أطلب وحدات دم لمريض (ابن/قريب)' },
    { v: 'staff', t: 'أحد العاملين بالوحدة', d: 'متابعة الحالات ولا يمكنني طلب وحدات' }
  ];
  return `<div class="radio-cards">${types.map(x => `
    <label class="radio-card">
      <input type="radio" name="utype" value="${x.v}" ${selected === x.v ? 'checked' : ''}>
      <strong>${x.t}</strong>
      <span>${x.d}</span>
    </label>`).join('')}</div>`;
}

  const updDecisionHint = () => {
    const end = addMonthsStr($('#p-decision-start').value, 6);
    const hint = $('#decision-end-hint');
    hint.textContent = end ? `تاريخ نهاية القرار تلقائيًا: ${end} (بعد 6 شهور)` : '';
  };
  $('#p-finance').onchange = () => {
    $('#decision-field').hidden = $('#p-finance').value !== 'expense';
    updDecisionHint();
  };
  $('#p-decision-start').onchange = updDecisionHint;

    const i = parseNationalId($('#p-national').value.trim());
    $('#p-national-info').textContent = i ? `📅 ${i.birth} — ${i.age} سنة — ${i.gov} — ${i.gender}` : '';

    $('#p-age').value = i ? i.age + ' سنة' : '';
    $('#p-gender').value = i ? i.gender : '';
    $('#p-gov').value = i ? i.gov : '';
  };

    const name = $('#p-name').value.trim();
    const nationalId = $('#p-national').value.trim();
    const phone = $('#p-phone').value.trim();
    const hemoglobin = $('#p-hemo').value.trim();
    const userType = document.querySelector('input[name="utype"]:checked').value;
    const patientNationalId = $('#p-patient-national').value.trim();
    const patientCategory = userType === 'patient' ? document.querySelector('input[name="pcat"]:checked').value : '';
    const whatsappNumber = userType === 'staff' ? $('#p-wa').value.trim() : '';

    if (!validQuad(name)) return toast('الاسم يجب أن يكون رباعيًا (4 أسماء على الأقل)', 'error');
    if (!NID_RE.test(nationalId)) return toast('الرقم القومي يجب أن يكون 14 رقم', 'error');
    if (!PHONE_RE.test(phone)) return toast('رقم التليفون يجب أن يكون 11 رقم يبدأ بـ 01', 'error');
    if (!hemoglobin || isNaN(+hemoglobin)) return toast('أدخل نسبة الهيموجلوبين', 'error');
    const center = $('#p-center').value.trim();
    const village = $('#p-village').value.trim();
    if (!center) return toast('أدخل المركز', 'error');
    if (userType === 'guardian' && !NID_RE.test(patientNationalId)) return toast('أدخل الرقم القومي للمريض (14 رقم)', 'error');
    const isStaffReg = userType === 'staff';
    const financeType = isStaffReg ? '' : $('#p-finance').value;
    const decisionStartVal = isStaffReg ? '' : $('#p-decision-start').value;
    if (financeType === 'expense' && !decisionStartVal) return toast('أدخل تاريخ بداية قرار النفقة', 'error');

    Store.updateProfile({
      name, nationalId, phone, bloodType: $('#p-blood').value,
      hemoglobin, userType,
      patientNationalId: userType === 'guardian' ? patientNationalId : '',
      patientCategory,
      whatsappNumber,
      financeType,
      center, village,
      address: [$('#p-gov').value, center, village].filter(Boolean).join(' - '),
      birthDate: (parseNationalId(nationalId) || {}).birth || '',
      governorate: (parseNationalId(nationalId) || {}).gov || '',
      decisionStart: financeType === 'expense' ? decisionStartVal : '',
      decisionEnd: financeType === 'expense' ? addMonthsStr(decisionStartVal, 6) : '',
      profileComplete: true
    });
    Store.sendNotif({
      to: 'admins',
      title: 'اكتمل ملف مستخدم',
      body: `${name} أكمل بياناته — النوع: ${USER_TYPES[userType]} — اضغط لكتابة رقم الملف`,
      mandatory: false,
      link: 'user:' + Store.state.user.uid
    });
    toast('تم حفظ بياناتك بنجاح', 'success');
  };
}

      </div>
      <form id="auth-form" novalidate>
        <div class="field" id="name-field" hidden>

          <input type="text" id="f-name" placeholder="اكتب اسمك بالكامل">

        </div>

      </form>
    </div>
  </div>`;

  let mode = 'login';
  const setMode = m => {
    mode = m;
    $('#tab-login').classList.toggle('active', m === 'login');
    $('#tab-register').classList.toggle('active', m === 'register');
    $('#name-field').hidden = m === 'login';
    $('#auth-submit').textContent = m === 'login' ? 'دخول ←' : 'إنشاء الحساب';
  };
  $('#tab-login').onclick = () => setMode('login');
  $('#tab-register').onclick = () => setMode('register');

  $('#auth-form').onsubmit = async e => {
    e.preventDefault();
    const phone = $('#f-phone').value.trim();
    const pass = $('#f-pass').value;
    const name = $('#f-name').value.trim();
    if (!PHONE_RE.test(phone)) return toast('أدخل رقم تليفون صحيح (11 رقم يبدأ بـ 01)', 'error');
    if (!pass) return toast('أدخل كلمة المرور', 'error');
    const btn = $('#auth-submit');
    btn.disabled = true;
    try {
      if (mode === 'login') {
        Store.mode === 'firebase' ? await Store.signIn(phone, pass) : Store.localSignIn(phone, pass);
        toast('أهلاً بعودتك', 'success');
      } else {
        if (!validQuad(name)) throw new Error('الاسم يجب أن يكون رباعيًا (4 أسماء على الأقل)');
        Store.mode === 'firebase' ? await Store.register(name, phone, pass) : Store.localRegister(name, phone, pass);
        toast('تم إنشاء حسابك بنجاح', 'success');
      }
      requestNotifPermission();
    } catch (err) {
      toast(err.message || 'حدث خطأ، حاول مرة أخرى', 'error');
      btn.disabled = false;
    }
  };
}

/* =====================================================
   لوحة المستخدم
   ===================================================== */
let userTab = 'unit';
let pendingFiles = [];

function renderUserDashboard() {
  const user = currentUser();
  if (!user) return;
  const isStaff = user.userType === 'staff';
  if (isStaff && (userTab === 'unit' || userTab === 'clinic')) userTab = 'units';

  /* حجز العيادة للمرضى وولي الأمر فقط */
  const tabs = isStaff
    ? [['today', '📅 حجز الأسبوع'], ['units', 'الوحدات المطلوبة'], ['follow', '📋 متابعة الحالة'], ['profile', 'البيانات الشخصية']]
    : [['unit', 'طلب وحدة دم'], ['clinic', 'حجز يوم العيادة'], ['my', 'حجوزاتي'], ['profile', 'البيانات الشخصية']];

  /* تنبيه تجديد قرار النفقة قبل الانتهاء بـ 20 يوم */
  let warnHtml = '';
  if (user.financeType === 'expense' && user.decisionEnd) {
    const dLeft = daysUntil(user.decisionEnd);
    if (dLeft !== null && dLeft <= 20) {
      warnHtml = `<div style="background:${dLeft < 0 ? '#fee2e2' : '#fffbeb'};border:1px solid ${dLeft < 0 ? '#fca5a5' : '#fcd34d'};border-radius:12px;padding:13px 16px;margin-bottom:18px;font-size:.88rem;font-weight:800;color:${dLeft < 0 ? '#b91c1c' : '#b45309'}">
        ⚠️ ${dLeft < 0 ? `انتهت صلاحية قرار النفقة بتاريخ ${user.decisionEnd} — يجب التجديد فورًا` : `قرار النفقة ينتهي خلال ${dLeft} يوم (${user.decisionEnd}) — يجب التجديد قبل نهايته`}
      </div>`;
    }
  }

  $('#app').innerHTML = `
  <div class="page">
    <div class="page-head">
      <div>
        <h1>أهلاً، ${esc(user.name)} 👋</h1>
        <p>${isStaff ? 'تابع الوحدات المطلوبة واطلع على حالتها.' : 'اطلب وحدة دم أو احجز يوم العيادة وتابع حالة طلبك.'}</p>
      </div>
    </div>
    ${warnHtml}
    <div class="tabs">
      ${tabs.map(([k, l]) => `<button data-tab="${k}" class="${userTab === k ? 'active' : ''}">${l}</button>`).join('')}
    </div>
    <div id="tab-content"></div>
  </div>`;
  $$('.tabs button').forEach(b => b.onclick = () => { userTab = b.dataset.tab; pendingFiles = []; renderUserDashboard(); });
  if (userTab === 'unit') renderUnitForm();
  else if (userTab === 'profile') renderMyProfile();
  else if (userTab === 'today') renderTodayAppointments();
  else if (userTab === 'units') renderStaffUnits();
  else if (userTab === 'follow') renderFollowUp('#tab-content');
  else if (userTab === 'clinic') renderClinicForm();
  else { renderMyBookings(); renderMyTransfusionFile(); }
}

      <div class="field"><label>كلمة المرور الحالية</label><input type="password" id="pw-old" required></div>

      <button class="btn btn-primary btn-block" type="submit">تغيير كلمة المرور ←</button>
    </form>

    $('#m-national-info').textContent = i ? `📅 ${i.birth} — ${i.age} سنة — ${i.gov} — ${i.gender}` : '';
    if (i) {
      $('#m-birth').value = i.birth;
      $('#m-age').value = i.age + ' سنة';
      $('#m-gender').value = i.gender;
      $('#m-gov').value = i.gov;
    }
  };
  $('#m-national').oninput = updNid;
  updNid();
  if (!isStaffU) {
    const updHint = () => {
      const end = addMonthsStr($('#m-decision-start').value, 6);
      $('#m-decision-hint').textContent = end ? `نهاية القرار تلقائيًا: ${end}` : '';
    };
    $('#m-finance').onchange = () => { $('#m-decision-field').hidden = $('#m-finance').value !== 'expense'; updHint(); };
    $('#m-decision-start').onchange = updHint;
    updHint();
  }
  $('#my-profile-form').onsubmit = e => {
    e.preventDefault();
    const name = $('#m-name').value.trim();
    const phone = $('#m-phone').value.trim();
    const nationalId = $('#m-national').value.trim();
    const finance = isStaffU ? '' : $('#m-finance').value;
    const start = isStaffU ? '' : $('#m-decision-start').value;
    if (!validQuad(name)) return toast('الاسم يجب أن يكون رباعيًا (4 أسماء على الأقل)', 'error');
    if (!PHONE_RE.test(phone)) return toast('رقم التليفون غير صحيح', 'error');
    if (!NID_RE.test(nationalId)) return toast('الرقم القومي غير صحيح', 'error');
    if (!$('#m-hemo').value.trim()) return toast('أدخل نسبة الهيموجلوبين', 'error');
    if (!isStaffU && finance === 'expense' && !start) return toast('أدخل تاريخ بداية قرار النفقة', 'error');
    const nidInfo = parseNationalId(nationalId) || {};
    Store.updateProfile({
      name, phone, nationalId,
      birthDate: nidInfo.birth || '', governorate: nidInfo.gov || '',
      center: $('#m-center').value.trim(), village: $('#m-village').value.trim(),
      address: [$('#m-gov').value, $('#m-center').value.trim(), $('#m-village').value.trim()].filter(Boolean).join(' - '),
      bloodType: $('#m-blood').value,
      hemoglobin: $('#m-hemo').value.trim(),
      whatsappNumber: isStaffU ? ($('#m-wa') ? $('#m-wa').value.trim() : '') : (u.whatsappNumber || ''),
      financeType: finance,
      decisionStart: finance === 'expense' ? start : '',
      decisionEnd: finance === 'expense' ? addMonthsStr(start, 6) : ''
    });
    toast('تم حفظ بياناتك بنجاح', 'success');
  };
  $('#pwd-form').onsubmit = async e => {
    e.preventDefault();
    const oldP = $('#pw-old').value;
    const newP = $('#pw-new').value;
    const conf = $('#pw-conf').value;
    if (newP.length < 6) return toast('كلمة المرور الجديدة 6 أحرف على الأقل', 'error');
    if (newP !== conf) return toast('تأكيد كلمة المرور غير متطابق', 'error');
    try {
      if (Store.mode === 'firebase') {
        const me = Store.state.profile;
        await Store.auth.signInWithEmailAndPassword((me.phone || '') + FB_EMAIL_SUFFIX, oldP);
        await Store.auth.currentUser.updatePassword(newP);
      } else {
        const d = Store._local();
        const u2 = d.users.find(x => x.id === Store.state.user.uid);
        if (!u2 || u2.password !== oldP) throw new Error('x');
        u2.password = newP;
        Store._commitLocal(d);
      }
      toast('تم تغيير كلمة المرور بنجاح', 'success');
      e.target.reset();
    } catch (err) {
      toast('كلمة المرور الحالية غير صحيحة', 'error');
    }
  };
}

function renderTodayAppointments(target) {
  const t = target || '#tab-content';
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date();
    d.setDate(d.getDate() + i);
    days.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'));
  }
  const list = Object.values(Store.state.bookings)
    .filter(b => days.includes(b.date))
    .sort((a, b) => ((a.date || '') + (a.time || '')).localeCompare((b.date || '') + (b.time || '')));
  const viewSwitch = `<div class="tabs" style="margin-bottom:14px">
    <button data-wv="name" class="${weekView === 'name' ? 'active' : ''}">👤 بالأسماء</button>
    <button data-wv="type" class="${weekView === 'type' ? 'active' : ''}">🩸 بنوع الوحدة</button>
  </div>`;
  let bodyHtml;
  if (weekView === 'type') {
    const groups = {};
    list.forEach(b => {
      const k = b.type === 'clinic' ? '🏥 حجوزات العيادة' : `🩸 وحدة ${UNIT_TYPES[b.unitType] || 'غير مغسولة'}`;
      (groups[k] = groups[k] || []).push(b);
    });
    bodyHtml = Object.keys(groups).length ? Object.entries(groups).map(([k, items]) => `
      <h2 style="font-size:.95rem;margin-top:14px">${k} (${items.length})</h2>
      <div class="table-wrap"><table><thead><tr><th>المريض</th><th>اليوم</th><th>التاريخ</th><th>الساعة</th><th>الحالة</th></tr></thead><tbody>
      ${items.map(b => `<tr>
        <td style="font-weight:700">${esc(b.userName)}</td>
        <td>${esc(b.day)}</td><td>${esc(b.date)}</td><td>${esc(b.time)}</td>
        <td><span class="status ${b.status}">${STATUS_LABELS[b.status]}</span>${b.postponedUntil ? `<br><small style="color:#6d28d9;font-weight:700">إلى ${esc(b.postponedUntil)}</small>` : ''}</td>
      </tr>`).join('')}
      </tbody></table></div>`).join('') : '<p style="color:var(--muted);font-size:.88rem">لا توجد حجوزات هذا الأسبوع.</p>';
  } else {
    bodyHtml = list.length ? days.map(day => {
      const items = list.filter(b => b.date === day);
      if (!items.length) return '';
      const wd = new Date(day + 'T00:00:00').getDay();
      const dayName = Object.keys(DAY_IDX).find(k => DAY_IDX[k] === wd);
      return `<h2 style="font-size:.95rem;margin-top:18px">${dayName} (${day}) — ${items.length}</h2>
      <div class="table-wrap"><table><thead><tr><th>المريض</th><th>النوع</th><th>الساعة</th><th>سحب العينة</th><th>الملفات</th><th>الحالة</th></tr></thead><tbody>
      ${items.map(b => `
      <tr>
        <td style="font-weight:700">${esc(b.userName)}</td>
        <td>${b.type === 'unit' ? `🩸 ${UNIT_TYPES[b.unitType] || ''}` : '🏥 عيادة'}</td>
        <td>${esc(b.time)}</td>
        <td>${b.type === 'unit' ? (b.sampleWithdrawal === 'day_before' ? 'قبل بيوم' : 'نفس اليوم') : '—'}</td>
        <td>${b.files?.length ? `<button class="btn btn-ghost btn-sm" onclick="viewFiles('${b.id}')">${b.files.length} 📎</button>` : '—'}</td>
        <td><span class="status ${b.status}">${STATUS_LABELS[b.status]}</span>${b.postponedUntil ? `<br><small style="color:#6d28d9;font-weight:700">إلى ${esc(b.postponedUntil)}</small>` : (b.postponeNotes ? `<br><small style="color:var(--muted)">${esc(b.postponeNotes)}</small>` : '')}</td>
      </tr>`).join('')}
      </tbody></table></div>`;
    }).join('') : '<p style="color:var(--muted);font-size:.88rem">لا توجد حجوزات هذا الأسبوع.</p>';
  }
  $(t).innerHTML = `<div class="card"><h2>📅 حجز الأسبوع (من ${days[0]} إلى ${days[6]}) — ${list.length} حجز</h2>${viewSwitch}${bodyHtml}</div>`;
  $$('[data-wv]', $(t)).forEach(b => b.onclick = () => { weekView = b.dataset.wv; renderTodayAppointments(t); });
}

        </tr>`).join('')}
      </tbody>
    </table></div>`}
  </div>`;

  $$('[data-done]').forEach(btn => btn.onclick = () => openDoneModal(btn.dataset.done));
  if (canAct) {
    $$('[data-approve]').forEach(btn => btn.onclick = () => staffAction(btn.dataset.approve, 'confirmed'));
    $$('[data-postpone]').forEach(btn => btn.onclick = () => openPostponeModal(btn.dataset.postpone));

    $$('[data-wa]').forEach(btn => btn.onclick = () => openWhatsApp(btn.dataset.wa));
  }
}

window.openWhatsApp = bookingId => {

  const u = Store.state.users[b.userId] || {};
  let phone = (u.phone || '').replace(/\D/g, '');

  const msg = 'مرحبًا ' + b.userName + '،' + NL +
    'تحديث من الوحدة العلاجية لأمراض الدم — مستشفى دكرنس العام:' + NL +

  const div = document.createElement('div');
  div.className = 'modal';

          <div class="field"><label>تاريخ التركيب</label><input id="dn-date" value="${todayLocal()}" readonly style="background:#f3f4f6"></div>
          <div class="field"><label>الساعة</label><input type="time" id="dn-time" value="${nowTime}"></div>
        </div>
        <div class="field">
          <label>صورة تحليل صورة الدم (إجباري)</label>
          <div class="dropzone" id="dn-drop" style="padding:16px">
            <div>${doneImg ? '✅ تم اختيار صورة — اضغط للتغيير' : 'اضغط لرفع صورة التحليل'}</div>
            <input type="file" id="dn-file" hidden accept="image/*">
          </div>
          ${doneImg ? `<img src="${doneImg}" style="width:100%;max-height:180px;object-fit:contain;border-radius:10px;border:1px solid var(--line);margin-top:8px">` : ''}
        </div>
        <button class="btn btn-primary btn-block" type="submit">تأكيد التركيب وتسجيل التحليل ←</button>
      </form>
    </div>`;
  document.body.appendChild(div);
  div.querySelector('.modal-close').onclick = () => div.remove();
  div.onclick = e => { if (e.target === div) div.remove(); };
  $('#dn-drop').onclick = () => $('#dn-file').click();
  $('#dn-file').onchange = e => {
    const f = e.target.files[0];
    if (!f) return;
    fileToCompressed(f, dataUrl => {
      doneImg = dataUrl;
      $('#dn-drop div').textContent = '✅ تم اختيار صورة — اضغط للتغيير';
    });
  };
  $('#done-form').onsubmit = e => {
    e.preventDefault();
    if (!doneImg) return toast('ارفع صورة تحليل الدم أولًا', 'error');

    if (!d || !t) return toast('حدد التاريخ والساعة', 'error');

    Store.pushTransfusionLog(b.userId, bookingId, { date: d, time: t, image: doneImg });
    Store.sendNotif({
      to: b.userId, title: 'تم التركيب بنجاح',
      body: `تم تركيب وحدة الدم (${UNIT_TYPES[b.unitType] || ''}) بتاريخ ${d} الساعة ${t}.
مسجل في ملف التركيبات الخاص بك.`,
      mandatory: true
    });
    toast('تم تسجيل التركيب والتحليل في ملف المريض', 'success');
    div.remove();
  };
};

function addFiles(fileList) {
  const files = [...fileList];
  if (pendingFiles.length + files.length > 5) return toast('الحد الأقصى 5 صور', 'error');
  files.forEach(f => {
    if (f.size > 10 * 1024 * 1024) return toast(`الصورة ${f.name} أكبر من 10 ميجا`, 'error');
    fileToCompressed(f, dataUrl => { pendingFiles.push({ name: f.name, type: 'image/jpeg', dataUrl }); renderFileList(); });
  });
}
function renderFileList() {
  const list = $('#file-list');
  if (!list) return;
  list.innerHTML = pendingFiles.map((f, i) => `
    <div class="file-item">
      ${f.type.startsWith('image/') ? `<img src="${f.dataUrl}" alt="">` : '📄'}
      <span class="fname">${esc(f.name)}</span>
      <button type="button" data-i="${i}">إزالة</button>
    </div>`).join('');
  $$('button[data-i]', list).forEach(b => b.onclick = () => { pendingFiles.splice(+b.dataset.i, 1); renderFileList(); });
}

  };
  $('#ed-drop').onclick = () => $('#ed-files').click();
  $('#ed-files').onchange = e => {
    [...e.target.files].forEach(f => {
      if (editDocs.length >= 15) return toast('الحد الأقصى 15 صورة', 'error');

    });

  };
  renderEditDocs();
  const updHint = () => {
    const end = addMonthsStr($('#e-decision-start').value, 6);
    $('#e-decision-hint').textContent = end ? `نهاية القرار تلقائيًا: ${end} (بعد 6 شهور)` : '';

  const updNid = () => {
    const i = parseNationalId($('#e-national').value.trim());
    $('#e-national-info').textContent = i ? `📅 ${i.birth} — ${i.age} سنة — ${i.gov} — ${i.gender}` : '';
    if (i) {
      $('#e-birth').value = i.birth;
      $('#e-age').value = i.age + ' سنة';
      $('#e-gender').value = i.gender;
      $('#e-gov').value = i.gov;
    }
  };
  $('#e-national').oninput = updNid;
  updNid();
  $('#edit-user-form').onsubmit = e => {
    e.preventDefault();
    const name = $('#e-name').value.trim();
    const phone = $('#e-phone').value.trim();
    const finance = $('#e-finance').value;
    const start = $('#e-decision-start').value;
    if (!validQuad(name)) return toast('الاسم يجب أن يكون رباعيًا (4 أسماء على الأقل)', 'error');
    if (phone && !PHONE_RE.test(phone)) return toast('رقم التليفون غير صحيح', 'error');
    if (finance === 'expense' && !start) return toast('أدخل تاريخ بداية قرار النفقة', 'error');
    const nidInfo = parseNationalId($('#e-national').value.trim()) || {};
    Store.adminUpdateUser(userId, {
      docs: editDocs,
      name, phone,
      birthDate: nidInfo.birth || '',
      governorate: nidInfo.gov || '',
      fileNumber: $('#e-fileno').value.trim(),
      nationalId: $('#e-national').value.trim(),
      bloodType: $('#e-blood').value,
      hemoglobin: $('#e-hemo').value.trim(),
      center: $('#e-center').value.trim(),
      village: $('#e-village').value.trim(),
      address: [$('#e-gov').value, $('#e-center').value.trim(), $('#e-village').value.trim()].filter(Boolean).join(' - '),
      userType: $('#e-utype').value,
      patientNationalId: $('#e-utype').value === 'guardian' ? $('#e-patient-national').value.trim() : '',
      patientCategory: $('#e-utype').value === 'patient' ? $('#e-pcat').value : '',
      whatsappNumber: $('#e-utype').value === 'staff' ? $('#e-wa').value.trim() : '',
      financeType: finance,
      decisionStart: finance === 'expense' ? start : '',
      decisionEnd: finance === 'expense' ? addMonthsStr(start, 6) : ''
    });
    toast('تم حفظ التعديلات بنجاح', 'success');
    div.remove();
  };
};

/* =====================================================
   لوحة المشرف
   ===================================================== */
let adminTab = 'bookings';
let bookingFilter = 'all';
let bookingSearch = '';
let pendingOnly = false;
let weekView = 'name';

/* ترحيل تلقائي: الحالات القديمة "تم التركيب" تدخل سجل التركيبات ويُعاد حساب العداد */
function backfillTransfusions() {
  if (Store.mode !== 'firebase') return;
  const users = Store.state.users;
  const bookings = Object.values(Store.state.bookings);
  bookings.filter(b => b.type === 'unit' && b.status === 'done').forEach(b => {
    const u = users[b.userId];
    if (!u) return;
    if (!(u.transfusionLog && u.transfusionLog[b.id])) {
      Store.db.ref('users/' + b.userId + '/transfusionLog/' + b.id).set({
        date: b.testDate || b.date,
        time: b.testTime || b.time || '',
        image: b.testImage || ''
      });
    }
  });
  Object.entries(users).forEach(([uid, u]) => {
    const n = bookings.filter(b => b.type === 'unit' && b.status === 'done' && b.userId === uid).length;
    if ((u.transfusionCount || 0) !== n) Store.db.ref('users/' + uid + '/transfusionCount').set(n);
  });
}

function renderAdmin() {
  if (!window.__htuMigrated) { window.__htuMigrated = true; backfillTransfusions(); }
  const bookings = Object.values(Store.state.bookings);
  const users = Object.values(Store.state.users);
  const me = currentUser();
  if (!me || me.role !== 'admin') return;

  /* تنبيهات تجديد قرارات النفقة (خلال 20 يوم أو منتهية) */
  const renewals = users.filter(u => u.financeType === 'expense' && u.decisionEnd && (daysUntil(u.decisionEnd) ?? 999) <= 20);
  const renewalsHtml = renewals.length ? `
    <div class="card" style="border-color:#f59e0b;background:#fffbeb">
      <h2 style="color:#b45309">⚠️ تنبيهات تجديد قرارات النفقة (${renewals.length})</h2>
      ${renewals.map(u => {
        const dLeft = daysUntil(u.decisionEnd);
        return `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #fde68a;flex-wrap:wrap">
          <div><strong>${esc(u.name)}</strong> <small style="color:var(--muted)">${esc(u.phone || '')}</small></div>
          <div style="font-weight:800;color:${dLeft < 0 ? '#b91c1c' : '#b45309'}">${dLeft < 0 ? `منتهي منذ ${-dLeft} يوم (${u.decisionEnd})` : `ينتهي خلال ${dLeft} يوم (${u.decisionEnd})`}</div>
        </div>`;
      }).join('')}
    </div>` : '';

  $('#app').innerHTML = `
  <div class="page">
    <div class="page-head">
      <div>
        <h1>لوحة تحكم المشرف</h1>
        <p>إدارة الحجوزات والمستخدمين والإشعارات.</p>
      </div>
    </div>
    <div class="stats">
      <div class="stat-card"><div class="ic">🩸</div><div><div class="num">${bookings.filter(b => b.type === 'unit').length}</div><div class="lbl">طلبات وحدات الدم</div></div></div>
      <div class="stat-card"><div class="ic">🏥</div><div><div class="num">${bookings.filter(b => b.type === 'clinic').length}</div><div class="lbl">حجوزات العيادة</div></div></div>
      <div class="stat-card"><div class="ic">👥</div><div><div class="num">${users.length}</div><div class="lbl">المستخدمون</div></div></div>
      <div class="stat-card" style="cursor:pointer" onclick="showPending()" title="اضغط لعرض الحالات بانتظار المراجعة">
        <div class="ic">⏳</div>
        <div><div class="num">${bookings.filter(b => b.status === 'pending').length}</div><div class="lbl">بانتظار المراجعة ← اضغط</div></div>
      </div>
    </div>
    ${renewalsHtml}
    <div class="tabs">
      <button data-tab="bookings" class="${adminTab === 'bookings' ? 'active' : ''}">الحجوزات</button>
      <button data-tab="week" class="${adminTab === 'week' ? 'active' : ''}">📅 حجز الأسبوع</button>
      <button data-tab="users" class="${adminTab === 'users' ? 'active' : ''}">المستخدمون</button>
      <button data-tab="stats" class="${adminTab === 'stats' ? 'active' : ''}">📊 الإحصائيات</button>
      <button data-tab="follow" class="${adminTab === 'follow' ? 'active' : ''}">📋 متابعة الحالة</button>
      <button data-tab="notify" class="${adminTab === 'notify' ? 'active' : ''}">إرسال إشعار</button>
    </div>
    <div id="admin-content"></div>
  </div>`;
  $$('.tabs button').forEach(b => b.onclick = () => { adminTab = b.dataset.tab; renderAdmin(); });

  if (adminTab === 'bookings') renderAdminBookings();
  else if (adminTab === 'users') renderAdminUsers();
  else if (adminTab === 'stats') renderAdminStats();
  else if (adminTab === 'week') renderTodayAppointments('#admin-content');
  else if (adminTab === 'follow') renderFollowUp('#admin-content');
  else renderAdminNotify();
}

function renderAdminBookings() {
  /* المكتمل (تم التركيب) ينتقل لمتابعة الحالة ويختفي من هنا */
  let bookings = Object.values(Store.state.bookings)
    .filter(b => b.status !== 'done')
    .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  const counts = {
    all: bookings.length,
    unit: bookings.filter(b => b.type === 'unit').length,
    clinic: bookings.filter(b => b.type === 'clinic').length
  };
  if (bookingFilter !== 'all') bookings = bookings.filter(b => b.type === bookingFilter);
  if (bookingSearch) {
    const q = bookingSearch;
    bookings = bookings.filter(b =>
      (b.userName || '').includes(q) ||
      ((Store.state.users[b.userId] || {}).phone || '').includes(q));
  }
  if (pendingOnly) bookings = bookings.filter(b => b.status === 'pending');

  $('#admin-content').innerHTML = `
  <div class="card">
    <h2>جميع الحجوزات</h2>
    ${pendingOnly ? `
    <div style="background:#fffbeb;border:1px solid #fcd34d;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:.85rem;font-weight:800;color:#b45309;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      ⏳ عرض الحالات بانتظار المراجعة فقط
      <button class="btn btn-ghost btn-sm" id="clear-pending">عرض الكل</button>
    </div>` : ''}
    <div class="field" style="margin-bottom:14px">
      <input type="text" id="bk-search" placeholder="🔍 بحث بالاسم أو التليفون..." value="${esc(bookingSearch)}">
    </div>
    <div class="tabs" style="margin-bottom:16px">
      <button class="${bookingFilter === 'all' ? 'active' : ''}" data-f="all">الكل (${counts.all})</button>
      <button class="${bookingFilter === 'unit' ? 'active' : ''}" data-f="unit">وحدات دم (${counts.unit})</button>
      <button class="${bookingFilter === 'clinic' ? 'active' : ''}" data-f="clinic">يوم العيادة (${counts.clinic})</button>
    </div>
    ${bookings.length === 0 ? `<div class="empty-state"><p>لا توجد حجوزات.</p></div>` : `
    <div class="table-wrap"><table>
      <thead><tr><th>المستخدم</th><th>النوع</th><th>اليوم</th><th>التاريخ</th><th>الساعة</th><th>الوحدة</th><th>سحب العينة</th><th>الملفات</th><th>الفصيلة</th><th>التقديم</th><th>الحالة</th></tr></thead>
      <tbody>
      ${bookings.map(b => `
        <tr>
          <td style="font-weight:700">${esc(b.userName)}</td>
          <td>${b.type === 'unit' ? '🩸 وحدة دم' : '🏥 عيادة'}</td>
          <td>${esc(b.day)}</td><td>${esc(b.date)}</td><td>${esc(b.time)}</td>
          <td>${b.type === 'unit' ? (UNIT_TYPES[b.unitType] || 'غير مغسولة') : '—'}</td>
          <td>${b.type === 'unit' ? (b.sampleWithdrawal === 'day_before' ? 'قبل بيوم' : 'نفس اليوم') : '—'}</td>
          <td>${b.files?.length ? `<button class="btn btn-ghost btn-sm" onclick="viewFiles('${b.id}')">${b.files.length} 📎</button>` : '—'}</td>
          <td style="font-weight:800">${esc((Store.state.users[b.userId] || {}).bloodType || '—')}</td>
          <td>${FINANCE_TYPES[(Store.state.users[b.userId] || {}).financeType] || '—'}</td>
          <td style="display:flex;gap:6px;align-items:center">
            <button class="btn btn-green btn-sm" data-wa="${b.id}" title="إشعار عبر واتساب">واتساب</button>
            <button class="btn btn-danger-soft btn-sm" data-bdel="${b.id}" title="حذف الحجز">🗑</button>
            <select class="status-select" data-id="${b.id}">
              ${Object.entries(b.type === 'clinic' ? { pending: 'قيد المراجعة', confirmed: 'تمت الموافقة', cancelled: 'غير متاح' } : STATUS_LABELS).map(([k, v]) => `<option value="${k}" ${b.status === k ? 'selected' : ''}>${v}</option>`).join('')}
            </select>
          </td>
        </tr>`).join('')}
      </tbody>
    </table></div>`}
  </div>`;

  $$('#admin-content [data-f]').forEach(b => b.onclick = () => { bookingFilter = b.dataset.f; renderAdmin(); });
  const cp = $('#clear-pending');
  if (cp) cp.onclick = () => { pendingOnly = false; renderAdminBookings(); };
  const bkS = $('#bk-search');
  if (bkS) bkS.oninput = () => {
    bookingSearch = bkS.value.trim();
    renderAdminBookings();
    const s2 = $('#bk-search');
    if (s2) { s2.focus(); s2.setSelectionRange(s2.value.length, s2.value.length); }
  };
  $$('.status-select').forEach(sel => sel.onchange = () => {
    const b = Store.state.bookings[sel.dataset.id];
    if (!b) return;
    if (sel.value === 'postponed') {
      openPostponeModal(b.id);
      sel.value = b.status;
      return;
    }
    if (sel.value === 'done' && b.status !== 'done' && b.type === 'unit') {
      openDoneModal(b.id);
      sel.value = b.status;
      return;
    }
    Store.setBookingStatus(b.id, sel.value);
    Store.sendNotif({
      to: b.userId,
      title: b.type === 'unit' ? 'تحديث حالة طلب وحدة الدم' : 'تحديث حالة حجز العيادة',
      body: `تم تحديث حالة حجزك (${b.day} ${b.date} الساعة ${b.time}) إلى: ${STATUS_LABELS[sel.value]}`,
      mandatory: true
    });
    toast('تم تحديث الحالة وإخطار المستخدم', 'success');
  });
  $$('[data-wa]').forEach(b => b.onclick = () => openWhatsApp(b.dataset.wa));
  $$('[data-bdel]').forEach(b => b.onclick = () => {
    if (!confirm('حذف هذا الحجز نهائيًا؟')) return;
    Store.deleteBooking(b.dataset.bdel);
    toast('تم حذف الحجز', 'success');
  });
}

          <td>${FINANCE_TYPES[u.financeType] || '—'}</td>
          <td><span class="status done">${c} مرة</span></td>
        </tr>`).join('')}</tbody>
    </table></div>` : '<p style="color:var(--muted);font-size:.88rem">لا توجد تركيبات مسجلة — العداد يزيد فقط عند تحويل حالة طلب وحدة دم إلى "تم التركيب".</p>'}`;
  }
  $('#admin-content').innerHTML = `
  <div class="card">
    <div class="tabs" style="margin-bottom:18px">
      ${sub('blood', '🩸 تقسيم الفصايل')}
      ${sub('finance', '💳 نوع التقديم')}
      ${sub('transfusion', '🔢 مرات التركيب')}
      ${sub('report', '🖨️ تقرير شهري')}
    </div>
    ${body}
  </div>`;
  $$('#admin-content [data-st]').forEach(b => b.onclick = () => { adminStatsTab = b.dataset.st; renderAdmin(); });
  const rp = $('#rep-print');
  if (rp) rp.onclick = () => printMonthlyReport($('#rep-month').value);
}

function printMonthlyReport(month) {
  if (!month) return toast('اختر الشهر أولًا', 'error');
  const all = Object.values(Store.state.bookings).filter(b => (b.date || '').startsWith(month));
  if (!all.length) return toast('لا توجد حجوزات في هذا الشهر', 'error');
  const units = all.filter(b => b.type === 'unit');
  const clinics = all.filter(b => b.type === 'clinic');
  const done = units.filter(b => b.status === 'done');
  const byStatus = {};
  all.forEach(b => { const l = STATUS_LABELS[b.status] || b.status; byStatus[l] = (byStatus[l] || 0) + 1; });
  const byUnit = {};
  units.forEach(b => { const t = UNIT_TYPES[b.unitType] || 'غير مغسولة'; byUnit[t] = (byUnit[t] || 0) + 1; });
  const doneRows = done.map(b => `<tr><td>${esc(b.userName)}</td><td>${UNIT_TYPES[b.unitType] || ''}</td><td>${esc(b.date)}</td><td>${esc(b.time)}</td></tr>`).join('');
  const tbl = (obj) => `<table><tr><th>البند</th><th>العدد</th></tr>${Object.entries(obj).map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('')}</table>`;
  const html = `<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>التقرير الشهري ${month}</title>
<style>body{font-family:'Cairo',Tahoma,sans-serif;padding:30px;color:#1f2937}h1{font-size:1.25rem;margin-bottom:4px}h2{font-size:1rem;margin:20px 0 10px;border-bottom:2px solid #1e3d59;padding-bottom:6px}table{width:100%;border-collapse:collapse;font-size:.88rem;margin-bottom:8px}th,td{border:1px solid #e5e7eb;padding:8px 10px;text-align:right}th{background:#eaf1f8}.muted{color:#6b7280;font-size:.82rem}</style></head><body>
<h1>الوحدة العلاجية لأمراض الدم — مستشفى دكرنس العام</h1>
<p class="muted">التقرير الشهري — الشهر: ${month} — تاريخ الإصدار: ${new Date().toLocaleDateString('ar-EG')}</p>
<h2>الإجمالي: ${all.length} حجز (وحدات دم: ${units.length} — عيادة: ${clinics.length})</h2>
<h2>وحدات الدم حسب النوع</h2>${tbl(byUnit)}
<h2>الحجوزات حسب الحالة</h2>${tbl(byStatus)}
<h2>التركيبات المنفذة (${done.length})</h2>
${done.length ? `<table><tr><th>المريض</th><th>الوحدة</th><th>التاريخ</th><th>الساعة</th></tr>${doneRows}</table>` : '<p class="muted">لا توجد تركيبات هذا الشهر.</p>'}
<script>setTimeout(function(){window.print()},500)<\/script></body></html>`;
  const w = window.open('', '_blank');
  w.document.write(html);
  w.document.close();
}

function renderAdminUsers() {
  const ids = Object.keys(Store.state.users);
  const users = ids.map(id => ({ id, ...Store.state.users[id] }));
  $('#admin-content').innerHTML = `
  <div class="card">
    <h2>إدارة المستخدمين</h2>
    <div class="table-wrap"><table>
      <thead><tr><th>الاسم</th><th>رقم الملف</th><th>التليفون</th><th>النوع</th><th>التقديم</th><th>الصفة</th><th>تاريخ التسجيل</th><th>إجراء</th></tr></thead>
      <tbody>
      ${users.map(u => `
        <tr>
          <td style="font-weight:700">${esc(u.name)}</td>
          <td>${esc(u.fileNumber || '—')}</td>
          <td dir="ltr">${esc(u.phone || '—')}</td>
          <td>${USER_TYPES[u.userType] || '—'}</td>
          <td>${FINANCE_TYPES[u.financeType] || '—'}</td>
          <td><span class="status ${u.role === 'admin' ? 'done' : 'pending'}">${u.role === 'admin' ? 'مشرف' : 'مستخدم'}</span></td>
          <td>${fmtDate(u.createdAt)}</td>
          <td>
            ${u.isRoot ? '<small style="color:var(--muted)">المشرف الرئيسي</small>' :
              `<div style="display:flex;gap:6px;flex-wrap:wrap">
                ${u.role !== 'admin'
                  ? `<button class="btn btn-green btn-sm" data-promote="${u.id}">⬆ ترقية</button>`
                  : `<button class="btn btn-danger-soft btn-sm" data-demote="${u.id}">⬇ إلغاء</button>`}
                <button class="btn btn-ghost btn-sm" data-qr="${u.id}" title="QR ملف المريض">QR</button>
                <button class="btn btn-blue btn-sm" data-edit="${u.id}">✏️ تعديل</button>
                <button class="btn btn-danger-soft btn-sm" data-del="${u.id}">🗑 حذف</button>
              </div>`}
          </td>
        </tr>`).join('')}
      </tbody>
    </table></div>
  </div>`;

  $$('[data-promote]').forEach(b => b.onclick = () => changeRole(b.dataset.promote, 'admin'));
  $$('[data-demote]').forEach(b => b.onclick = () => changeRole(b.dataset.demote, 'user'));
  $$('[data-edit]').forEach(b => b.onclick = () => openUserEdit(b.dataset.edit));
  $$('[data-qr]').forEach(b => b.onclick = () => showPatientQR(b.dataset.qr));
  $$('[data-del]').forEach(b => b.onclick = () => {
    const u = Store.state.users[b.dataset.del];
    if (!u) return;
    if (!confirm(`هل أنت متأكد من حذف المستخدم "${u.name}" نهائيًا؟`)) return;
    Store.deleteUser(b.dataset.del);
    toast(`تم حذف بيانات ${u.name} وحجوزاتها — ولمنع دخوله نهائيًا امسح حسابه من Firebase Console ← Authentication`, 'success', 6000);
  });
}

function changeRole(userId, newRole) {
  const name = Store.state.users[userId]?.name || 'المستخدم';
  Store.setUserRole(userId, newRole);
  Store.sendNotif({
    to: userId,
    title: newRole === 'admin' ? 'تمت ترقيتك لمشرف' : 'تم تغيير صلاحياتك',
    body: newRole === 'admin'
      ? 'مبارك! قام المشرف الرئيسي بترقيتك إلى مشرف. يمكنك الآن الدخول إلى لوحة التحكم من نفس حسابك.'
      : 'تم إلغاء صلاحيات الإشراف من حسابك وعودته لمستخدم عادي.',
    mandatory: true
  });
  toast(`تم ${newRole === 'admin' ? 'ترقية' : 'تغيير صلاحيات'} ${name}`, 'success');
}

      </div>
      <div class="field">

      </label>

    e.target.reset();
    $('#n-mandatory').checked = true;
  };
}

/* =====================================================
   التوجيه والتشغيل
   ===================================================== */
function route() {
  const user = currentUser();
  const hash = location.hash || '#/';

  if (!user) {
    if (hash !== '#/') { try { history.replaceState(null, '', '#/'); } catch(_){} }
    renderAuth();
    return;
  }
  if (!user.profileComplete && !user.isRoot) { renderProfileCompletion(); return; }
  /* المشرف يرى لوحة التحكم تلقائيًا في الصفحة الرئيسية — بدون تغيير اللينك */
  if (user.role === 'admin') {
    if (hash.startsWith('#/patient/')) {
      renderAdmin();
      const pid = hash.split('/')[2];
      setTimeout(() => openPatientCard(pid), 60);
      return;
    }
    if (hash === '#/dashboard') { try { history.replaceState(null, '', '#/'); } catch(_){} }
    renderAdmin();
    return;
  }
  renderUserDashboard();
}

function renderAll() {
  renderTopbar();
  renderNotifPanel();
  route();
  scanNewNotifications();
}

Store.onChange(() => {
  if (document.activeElement && ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) {
    renderTopbar(); return;
  }
  renderAll();
});
window.addEventListener('hashchange', renderAll);

window.addEventListener('error', function (e) {
  var appEl = document.getElementById('app');
  var t = document.getElementById('toast');
  if (t) {
    t.textContent = '⚠️ ' + (e.message || 'خطأ غير معروف');
    t.className = 'toast error';
    t.hidden = false;
  }
  if (appEl && !appEl.innerHTML.trim()) {
    try { renderAuth(); } catch (_) {}
  }
});

try { Store.init(); } catch (err) { console.warn(err); }
try { renderAll(); } catch (err) {
  var t0 = document.getElementById('toast');
  if (t0) { t0.textContent = '⚠️ ' + err.message; t0.className = 'toast error'; t0.hidden = false; }
  try { renderAuth(); } catch (_) {}
}
